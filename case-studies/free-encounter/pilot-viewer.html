<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memorabilia · Pilot live</title>
<style>
:root{font:16px/1.6 system-ui;color:#233831;background:#f4f5f1}*{box-sizing:border-box}body{margin:0}header{padding:26px 4vw;border-bottom:1px solid #ccd6cf;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font:30px Georgia;margin:0}small,.muted{color:#586b61;font-size:14px}main{max-width:1500px;margin:auto;padding:24px 4vw}#hero{background:#193e32;color:#fff;padding:24px 28px;border-radius:14px;margin-bottom:24px}#hero small{color:#c4ddd0}#current{font-size:25px;margin:8px 0}#queue{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0 24px}button,select{font:inherit;padding:10px 14px;border:1px solid #c4d1c8;border-radius:8px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{border:2px solid #276b4f;background:#e4efe6}button:focus-visible,select:focus-visible{outline:3px solid #e7ad3c}#queue button{text-align:left;min-height:90px}#queue small{display:block}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:#fff;border:1px solid #d8dfd9;border-radius:12px;padding:20px;min-width:0}h2{font-size:18px;margin:0 0 14px}pre{font:15px/1.75 system-ui;white-space:pre-wrap;overflow-wrap:anywhere;max-height:540px;overflow:auto;margin:0}#activity{max-height:280px;overflow:auto}article{padding:12px 0;border-bottom:1px solid #edf0ed}article p{margin:3px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}svg{width:100%;height:390px}#detail{max-height:150px;font-size:14px;background:#f3f6f2;padding:12px}#error{color:#a02920}progress{width:100%;accent-color:#b2dab4;height:9px}#follow{margin-left:auto}footer{margin-top:24px;color:#586b61;font-size:14px}@media(max-width:950px){#queue{grid-template-columns:repeat(3,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:500px){header{align-items:start;flex-direction:column}#queue{grid-template-columns:repeat(2,1fr)}}
</style>
<header><div><h1>Memorabilia <span class="muted">/ Pilot live</span></h1><small>Encounter trajectories and independent H001 observations</small></div><small id="connection" role="status">连接中…</small></header>
<main><section id="hero"><small>固定队列 · 自动执行</small><div id="current">正在读取运行状态…</div><div id="timing"></div><progress id="progress" max="24" value="0"></progress><small id="overall"></small></section><div id="error" role="alert"></div><div id="queue"></div><div class="toolbar"><label>Checkpoint <select id="checkpoint"></select></label><label>状态 <select id="phase"><option value="after">当前 / After</option><option value="before">Before</option></select></label><button id="follow">跟随正在运行</button></div><p id="stateLabel" class="muted"></p><div class="columns"><section class="panel"><h2>Notebook / H001 response</h2><pre id="note">等待记录</pre></section><section class="panel"><h2 id="counts">Concept map</h2><svg id="graph" viewBox="0 0 700 440" aria-label="Concept map"></svg><pre id="detail">点击节点或连线查看内容。</pre></section><section class="panel"><h2>最近动作 <small>· Trace Inspector</small></h2><div id="activity"></div></section><section class="panel"><h2>运行信息</h2><pre id="metadata"></pre></section></div><footer>每 3 秒自动刷新。正在写入的内容标为草稿；图形位置仅用于展示。此页面只读，不会改变实验队列或 agent 状态。</footer></main>
<script>
const $=id=>document.getElementById(id),names={W:'Weil',L:'Levinas',K:'Krishnamurti',H001:'H001 probe'},labels={running:'运行中',completed:'完成',accepted:'已接受',failed:'失败',blocked:'已暂停'};let data,selectedRun=null,selectedKey=null,follow=true;
const status=s=>labels[s]||s,pretty=o=>JSON.stringify(o,null,2);
function draw(g){const svg=$('graph');svg.replaceChildren();$('detail').textContent='点击节点或连线查看内容。';if(!g?.nodes?.length){$('counts').textContent='Concept map · 空图';return;} $('counts').textContent=`Concept map · ${g.nodes.length} nodes / ${g.edges.length} edges`;const pos=new Map(),ns='http://www.w3.org/2000/svg';function el(t,a){const n=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);return n;}g.nodes.forEach((n,i)=>{const a=i*2*Math.PI/g.nodes.length;pos.set(n.id,[350+270*Math.cos(a),220+170*Math.sin(a)]);});for(const e of g.edges){const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)continue;const line=el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#c4d3c8','stroke-width':3});line.onclick=()=>{$('detail').textContent=pretty(e)};svg.append(line);}for(const n of g.nodes){const[x,y]=pos.get(n.id),c=el('circle',{cx:x,cy:y,r:10,fill:'#347653',tabindex:0,role:'button','aria-label':n.label});const show=()=>{$('detail').textContent=pretty(n)};c.onclick=show;c.onkeydown=e=>{if(e.key==='Enter')show()};const title=el('title',{});title.textContent=n.label;c.append(title);const t=el('text',{x,y:y+24,'text-anchor':'middle','font-size':11});t.textContent=n.label.length>23?n.label.slice(0,21)+'…':n.label;svg.append(c,t);}}
function render(){document.title=data.kind==='no-memory-baseline'?'Memorabilia · No-memory baseline':'Memorabilia · Pilot live';const latest=data.runs.at(-1),active=latest?.checkpoints.at(-1);const done=data.runs.filter(r=>r.status==='completed').length;$('current').textContent=data.status==='running'?`${latest?.order.split('').join(' → ')||'等待'} · ${names[active?.material]||'准备下一轮'}`:`本批${status(data.status)}`;const elapsed=active?.live?.started?Math.max(0,Math.floor((Date.now()-Date.parse(active.live.started))/1000)):null;$('timing').textContent=data.status==='running'&&elapsed!==null?`当前 checkpoint 已运行 ${Math.floor(elapsed/60)} 分 ${elapsed%60} 秒`:'自动队列状态以运行记录为准';$('progress').max=data.orders.length*data.checkpointsPerRun;$('progress').value=data.runs.filter(r=>r.status!=='failed').reduce((n,r)=>n+r.steps.filter(s=>s.accepted).length+(r.probe?.status==='completed'?1:0),0);$('overall').textContent=`${done} / ${data.orders.length} 条完成 · ${data.kind==='no-memory-baseline'?'无记忆 baseline · 每次独立 H001':'每条 3 次 encounter + 1 次 H001'}`;
if(follow){selectedRun=latest?.id;selectedKey=active?.key;}const run=data.runs.find(r=>r.id===selectedRun)??latest;
$('queue').replaceChildren();for(const order of data.orders){const r=data.runs.filter(x=>x.order===order).at(-1),b=document.createElement('button');b.setAttribute('aria-pressed',String(r?.id===run?.id));b.append(document.createTextNode(order.split('').join(' → ')));const s=document.createElement('small');s.textContent=r?`${status(r.status)}${r.attempt>1?' · replacement':''}`:'等待自动开始';b.append(s);b.disabled=!r;b.onclick=()=>{follow=false;selectedRun=r.id;selectedKey=r.checkpoints.at(-1)?.key;render()};$('queue').append(b);}
$('checkpoint').replaceChildren();for(const c of run?.checkpoints??[]){const o=document.createElement('option');o.value=c.key;o.textContent=`${c.key} · ${names[c.material]}`;$('checkpoint').append(o);}const cp=run?.checkpoints.find(c=>c.key===selectedKey)??run?.checkpoints.at(-1);if(!cp)return;$('checkpoint').value=cp.key;const before=$('phase').value==='before';$('stateLabel').textContent=`${status(cp.status)} · ${cp.draft&&!before?'未提交草稿 · ':''}${follow?'跟随最新进度':'查看历史 checkpoint'}`;$('note').textContent=before?(cp.before?.notebook||'空 notebook'):cp.key==='H001'?(cp.response||'Probe 正在回答…'):(cp.note||'尚未写入 notebook');draw(before?cp.before?.graph:cp.graph??cp.before?.graph);
$('activity').replaceChildren();for(const a of [...(cp.live?.activity??[])].reverse()){const e=document.createElement('article'),s=document.createElement('small'),p=document.createElement('p');s.textContent=`${new Date(a.at).toLocaleTimeString()} · ${a.kind}`;p.textContent=a.text;e.append(s,p);$('activity').append(e);}$('metadata').textContent=pretty({batch:data.batchId,run:run.id,attempt:run.attempt,replacement_of:run.replacement_of,checkpoint:cp.key,trace:cp.live?.id,lastTraceEvent:cp.live?.last,error:run.error??null});}
$('checkpoint').onchange=()=>{follow=false;selectedKey=$('checkpoint').value;render()};$('phase').onchange=render;$('follow').onclick=()=>{follow=true;$('phase').value='after';render()};async function load(){try{const r=await fetch('/api/status');if(!r.ok)throw Error('暂时无法读取运行记录');data=await r.json();$('error').textContent='';$('connection').textContent='● 已连接 · '+new Date().toLocaleTimeString();render();}catch(e){$('connection').textContent='连接中断 · 自动重试';$('error').textContent=e.message+'；保留上次显示的数据。';}finally{setTimeout(load,3000)}}load();
</script></html>
