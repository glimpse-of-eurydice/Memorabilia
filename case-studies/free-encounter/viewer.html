<!doctype html><html lang="en"><meta charset="utf-8"><title>Memorabilia · Encounters</title>
<style>body{margin:32px;background:#f6f3ed;color:#31352f;font:16px system-ui}h1{font-family:Georgia}button,select{padding:10px;margin:4px;border:1px solid #b4b9aa;background:white;border-radius:8px}svg{width:100%;height:650px;background:#fffdf8;border-radius:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui;max-height:450px;overflow:auto}#detail{padding:15px;background:#e7ebdf}circle{cursor:pointer}text{pointer-events:none}small{color:#626a5b}</style>
<h1>Memorabilia</h1><p id="status">Loading encounters…</p><div id="tabs"></div><label>State <select id="phase"><option value="graph">After encounter</option><option value="pre">Before encounter</option></select></label><p id="counts"></p><svg id="graph" viewBox="0 0 1200 850"></svg><pre id="detail">Select a bubble or relation to inspect its details.</pre><h2>Notebook</h2><pre id="note"></pre><details><summary>Trace Inspector events · actual commands and messages</summary><pre id="events"></pre></details>
<script>
let data,index=0;const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
function el(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n;}
function render(){const s=data.steps[index];if(!s)return;$('note').textContent=s.note;$('events').textContent=JSON.stringify(s.events,null,2);const g=s[$('phase').value];$('counts').textContent=s.title+' · '+g.nodes.length+' bubbles · '+g.edges.length+' relations · '+(s.accepted?'accepted':'retained pre-state; inspect validation')+' · '+s.traceId;const svg=$('graph');svg.replaceChildren();const nodes=[...g.nodes].sort((a,b)=>a.id.localeCompare(b.id)),positions=new Map();nodes.forEach((n,i)=>{const a=i*2*Math.PI/nodes.length;positions.set(n.id,[600+440*Math.cos(a),425+340*Math.sin(a)]);});for(const e of g.edges){const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)continue;const line=el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#a2b3a0','stroke-width':2});line.style.cursor='pointer';line.onclick=()=>{$('detail').textContent=JSON.stringify(e,null,2)};svg.append(line);}for(const n of nodes){const[x,y]=positions.get(n.id);const c=el('circle',{cx:x,cy:y,r:22,fill:'#738d78',stroke:'#f5f2e8','stroke-width':3});c.onclick=()=>{$('detail').textContent=JSON.stringify(n,null,2)};svg.append(c,el('text',{x,y:y+38,'text-anchor':'middle','font-size':12},n.label.length>35?n.label.slice(0,32)+'…':n.label));}if(!nodes.length)svg.append(el('text',{x:600,y:425,'text-anchor':'middle'},'No map changes required — this state is empty.'));}
$('phase').onchange=render;async function load(){try{data=await(await fetch('/api/run')).json();$('status').textContent=data.id+' · '+data.status+' · agent-authored maps; deterministic layout';$('tabs').replaceChildren();data.steps.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.id+' · '+s.title.split(' — ')[0];b.onclick=()=>{index=i;render()};$('tabs').append(b)});render();}catch(e){$('status').textContent='Run is starting; waiting for first saved encounter.';}}load();setInterval(load,15000);
</script></html>
